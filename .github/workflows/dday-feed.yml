# Regenerates the D-Day feed (data/v1) that the DASH apps download from dash-worklife.org.
#
# Runs every Monday 03:00 KST (Sunday 18:00 UTC) and on demand. The generator only rewrites a file
# when its events changed, so most weeks this job ends with "no changes" and nothing is committed;
# when the holidays library, a curated YAML or the official KR source moves a date, the commit
# lands on the default branch and GitHub Pages redeploys it.
#
# Secrets: DATA_GO_KR_KEY (optional) - a data.go.kr service key for 한국천문연구원 특일정보. Without
# it the KR file is built from the holidays library alone and the log says so.

name: D-Day feed

on:
  schedule:
    - cron: "0 18 * * 0" # Sun 18:00 UTC = Mon 03:00 KST
  workflow_dispatch:

permissions:
  contents: write

# Two overlapping runs would race on the same commit; queue them instead.
concurrency:
  group: dday-feed
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/dday/requirements.txt

      - name: Install pinned dependencies
        run: python -m pip install --quiet -r tools/dday/requirements.txt

      - name: Run generator tests
        run: python -m unittest discover -s tools/dday -p "test_*.py"

      - name: Generate data/v1
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python tools/dday/generate.py --out data/v1

      - name: Validate against the feed contract
        run: python tools/dday/generate.py --check --out data/v1

      - name: Commit and push when files changed
        run: |
          git add data/v1
          if git diff --cached --quiet; then
            echo "No feed changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update D-Day feed ($(date -u +%Y-%m-%d))" \
            -m "Regenerated by .github/workflows/dday-feed.yml from the holidays library, curated YAML and the official KR source when available."
          git push origin "HEAD:${GITHUB_REF_NAME}"
