  - {id: kr-vat-preliminary-return-deadline, tier: 2, name: 부가세 예정신고 마감, name_en: VAT Preliminary Return Deadline, rule: "07-25", interests: [worker]}

  # --- tier 3: dated, verified ---------------------------------------------------------------
