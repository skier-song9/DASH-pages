# Curated (non-holiday) events for South Korea. Tier 2 entries recur every year and are shipped as
# a `rule` "MM-DD" that the app expands; tier 3 entries are dated one-offs and must cite the page
# the date was verified on in `src` - an entry without a verifiable source is left out rather than
# guessed. `interests` selects which onboarding chips show an event; an empty list means it is
# shown to everyone. Ids are written out in full and never change, because 👍/👎 reactions are keyed
# by them.
#
# Entry shapes (exactly one of):
#   rule: "MM-DD"                                  recurring; id has no year
#   nth_weekday: {month, weekday, n, offset}       computed; id gains -{year}
#   start: YYYY-MM-DD [end: YYYY-MM-DD]            dated; id must already end in -{year}

country: KR
events:
  # --- tier 2: recurring cultural days -----------------------------------------------------
  - {id: kr-valentines-day, tier: 2, name: 발렌타인데이, name_en: Valentine's Day, rule: "02-14", interests: [romance]}
  - {id: kr-white-day, tier: 2, name: 화이트데이, name_en: White Day, rule: "03-14", interests: [romance]}
  - {id: kr-black-day, tier: 2, name: 블랙데이, name_en: Black Day, rule: "04-14", interests: []}
  - {id: kr-april-fools-day, tier: 2, name: 만우절, name_en: April Fools' Day, rule: "04-01", interests: []}
  - {id: kr-parents-day, tier: 2, name: 어버이날, name_en: Parents' Day, rule: "05-08", interests: []}
  - {id: kr-teachers-day, tier: 2, name: 스승의날, name_en: Teachers' Day, rule: "05-15", interests: []}
  - {id: kr-rose-day, tier: 2, name: 로즈데이, name_en: Rose Day, rule: "05-14", interests: [romance]}
  - {id: kr-halloween, tier: 2, name: 할로윈, name_en: Halloween, rule: "10-31", interests: []}
  - {id: kr-pepero-day, tier: 2, name: 빼빼로데이, name_en: Pepero Day, rule: "11-11", interests: []}
  - {id: kr-christmas-eve, tier: 2, name: 크리스마스이브, name_en: Christmas Eve, rule: "12-24", interests: []}

  # --- tier 2: recurring tax calendar (statutory dates; a weekend deadline moves to the next
  #     business day, which the rule cannot express, so these read as "by this date") -----------
  - {id: kr-year-end-tax-service-opens, tier: 2, name: 연말정산 간소화 개통, name_en: Year-end Tax Settlement Service Opens, rule: "01-15", interests: [worker]}
  - {id: kr-vat-final-return-deadline, tier: 2, name: 부가세 확정신고 마감, name_en: VAT Final Return Deadline, rule: "01-25", interests: [worker]}
